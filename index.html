<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: topo laranja com a logo laranja; corpo laranja; conteúdo em blocos pretos com texto claro e destaques em laranja. Visual único (não muda com o tema do aparelho). */
:root {
  --brand: #f6b210; --brand-ink: #111111;
  --bg: #000000; --surface: #111111; --surface-2: #1f1f1f; --ink: #f4f1ec; --muted: #a9a29a; --line: #2e2b28;
  --accent: #f6b210; --accent-soft: #33270a; --gold: #f6b210; --gold-soft: #33270a;
  --btn-bg: transparent; --btn-fg: #f4f1ec; --btn-line: #4a4540; --btnp-bg: #f6b210; --btnp-fg: #111111;
  --field-bg: #fff8ea; --field-ink: #111111; --field-line: #c9a24a;
  --ok: #5cc895; --ok-soft: #15301f; --warn: #f6b210; --warn-soft: #33270a; --bad: #f08a80; --bad-soft: #3c1a18;
  --mana-w: #f2ead0; --mana-u: #2f6fb3; --mana-b: #3e3646; --mana-r: #c8402f; --mana-g: #2a7d4f;
  --f-display: "Fraunces", "Cooper Black", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: dark;
}
/* blocos pretos: os mesmos tokens, redefinidos para texto claro sobre preto */
.panel, .evcard, .hero, .bm, .banner, .champ {
  --surface: #111111; --surface-2: #1f1f1f; --ink: #f4f1ec; --muted: #a9a29a; --line: #2e2b28;
  --accent: #f6b210; --accent-soft: #33270a; --gold: #f6b210; --gold-soft: #33270a;
  --btn-fg: #f4f1ec; --btn-line: #4a4540; --btnp-bg: #f6b210; --btnp-fg: #111111;
  --ok: #5cc895; --ok-soft: #15301f; --warn: #f6b210; --warn-soft: #33270a; --bad: #f08a80; --bad-soft: #3c1a18;
  color: var(--ink); border: 1px solid #2a2a2a;
}
/* cartão laranja dentro de um bloco preto */
.hero .next {
  --surface: #f6b210; --surface-2: rgba(255, 255, 255, .28); --ink: #111111; --muted: rgba(17, 17, 17, .72); --line: rgba(17, 17, 17, .25);
  --accent: #111111; --accent-soft: rgba(17, 17, 17, .12); --btnp-bg: #111111; --btnp-fg: #f6b210; --ok: #0b5a31; --ok-soft: rgba(255, 255, 255, .4);
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.15; }
.display, .hero h1, .evhead h1, .evcard h3 { font-variation-settings: "SOFT" 100, "WONK" 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--brand-ink); border-bottom: 2px solid #111111; }
.top-in, .wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: block; background: none; border: 0; padding: 0; cursor: pointer; }
.brand img { height: 76px; width: auto; display: block; }
@media (max-width: 560px) { .brand img { height: 60px; } }
/* menu em botão flutuante */
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #111111; background: var(--brand); color: #111111; display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .55); }
.fab svg { width: 28px; height: 28px; }
.fab:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
.fab-menu { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 15; min-width: 220px; display: flex; flex-direction: column; gap: 2px; padding: 8px; background: #111111; border: 1px solid var(--brand); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
.fab-menu[hidden] { display: none; }
.fab-menu button { background: none; border: 0; text-align: left; padding: 12px 14px; border-radius: 10px; color: var(--ink); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
.fab-menu button:hover { background: #222222; }
.fab-menu button[aria-current="true"] { background: var(--brand); color: #111111; }
#app { padding-bottom: 96px; }
body.tv .fab, body.tv .fab-menu { display: none; }
@media (max-width: 560px) { .brand img { height: 60px; } }
.top :focus-visible { outline-color: #111111; }
.top-title { flex: 1 1 0; min-width: 0; font-family: var(--f-display); font-weight: 900; font-variation-settings: "SOFT" 100, "WONK" 0; font-size: clamp(20px, 4.2vw, 40px); line-height: 1.05; color: #111111; }

.wrap { padding-block: 24px 64px; display: grid; gap: 24px; }
.banner { background: var(--surface); border-radius: var(--r); padding: 10px 14px; font-size: 14px; font-weight: 600; }

.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.display { font-family: var(--f-display); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.grid3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.panel { background: var(--surface); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel h3 { font-size: 16px; margin-bottom: 10px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--btn-line); background: var(--btn-bg); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; text-decoration: none; color: var(--btn-fg); }
.btn:hover { border-color: var(--btn-fg); }
.btn.primary { background: var(--btnp-bg); border-color: var(--btnp-bg); color: var(--btnp-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #ffffff; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.open { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.live { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.draft { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.gold { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
body.tv .top { display: none; }
body.tv #app { max-width: none; padding: 20px clamp(16px, 2.5vw, 40px); }
.tv-head { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.tv-head img { height: clamp(60px, 9vw, 120px); width: auto; }
.tv-head h1 { font-size: clamp(26px, 3.6vw, 56px); margin: 0; line-height: 1.05; }
.tv-head .clock { font-size: clamp(40px, 6vw, 96px); }
.tv-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); align-items: start; }
@media (max-width: 900px) { .tv-grid { grid-template-columns: minmax(0, 1fr); } }
.tv-matches { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.tv-m { background: var(--surface); border: 1px solid #2a2a2a; border-left: 6px solid var(--brand); border-radius: 12px; padding: 12px 16px; display: grid; gap: 4px; font-size: clamp(16px, 1.4vw, 24px); }
.tv-m b.mesa { color: var(--brand); font-size: .8em; text-transform: uppercase; letter-spacing: .06em; }
.tv-m.done { opacity: .55; border-left-color: #2a2a2a; }
.tv-st { font-size: clamp(15px, 1.2vw, 22px); }
.tv-exit { position: fixed; right: 12px; bottom: 12px; opacity: .35; }
.tv-exit:hover { opacity: 1; }
.qr { background: #ffffff; padding: 8px; border-radius: 10px; width: 210px; max-width: 100%; }
.qr svg { display: block; width: 100%; height: auto; }
.qr-box { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.qr-box > .stack { flex: 1 1 220px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.qr-box .chip, .report .chip { white-space: normal; }
.report { font-size: 12px; text-align: right; }
.report select { font-size: 13px; }
details > summary { cursor: pointer; font-weight: 700; }
.listbox { white-space: pre-wrap; font-size: 12px; max-height: 260px; overflow: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 6px; min-width: 200px; }
.pip { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }

label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; background: var(--field-bg); border: 1px solid var(--field-line); border-radius: 8px; padding: 8px 10px; color: var(--field-ink); font-weight: 400; min-width: 0; color-scheme: light; }
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.form .wide { grid-column: 1 / -1; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }

/* abertura da divulgação: bloco laranja com o próximo evento num cartão preto */
.hero { background: var(--surface); border-radius: 14px; padding: 28px; display: grid; gap: 24px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: center; }
.hero h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(32px, 5vw, 50px); }
.hero p { margin: 0; max-width: 60ch; }
.hero .next { background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 18px; display: grid; gap: 8px; align-content: start; }
.hero .next .eyebrow { color: var(--accent); }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding: 20px; } }
.mana { display: flex; gap: 6px; }
.mana i { width: 14px; height: 14px; border-radius: 50%; display: block; }

.evcard { display: grid; gap: 10px; text-align: left; cursor: pointer; background: var(--surface); border: 2px solid var(--surface); border-radius: var(--r); padding: 16px; color: var(--ink); }
.evcard:hover { border-color: var(--brand); }
.evcard h3 { font-family: var(--f-display); font-size: 19px; font-weight: 800; }
.datebox { display: grid; place-items: center; width: 54px; height: 58px; border-radius: 8px; background: var(--btnp-bg); color: var(--btnp-fg); flex: none; line-height: 1; }
.datebox b { font-size: 22px; font-family: var(--f-mono); }
.datebox span { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--btnp-bg); }

/* abas do evento */
.evhead { display: grid; gap: 8px; }
.evhead h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 4vw, 40px); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; color: inherit; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.me td { background: var(--gold-soft); }
td.r, th.r { text-align: right; }

.match { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.match:last-child { border-bottom: 0; }
.match.me { background: var(--gold-soft); }
.mesa { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; }
.mesa b { display: block; font-size: 18px; color: var(--ink); }
.vs { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; min-width: 0; }
.vs .pl { font-weight: 600; }
.vs .pl.win { color: var(--ok); }
.vs .x { color: var(--muted); font-size: 12px; }
.pod { display: flex; gap: 6px 14px; flex-wrap: wrap; }
.pod span { font-weight: 600; }
.pod small { font-family: var(--f-mono); color: var(--muted); margin-right: 3px; }
@media (max-width: 560px) { .match { grid-template-columns: 40px minmax(0, 1fr); } .match > :last-child { grid-column: 2; } }

.clock { font-family: var(--f-mono); font-size: 28px; font-weight: 500; letter-spacing: .02em; }
.clock.over { color: var(--bad); }

/* chave */
.bracket { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 8px; }
.bcol { display: flex; flex-direction: column; justify-content: space-around; gap: 12px; min-width: 200px; }
.bcol h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.bm { border-radius: 8px; background: var(--surface); overflow: hidden; font-size: 14px; }
.bm div { padding: 6px 10px; display: flex; justify-content: space-between; gap: 8px; }
.bm div + div { border-top: 1px solid var(--line); }
.bm .w { font-weight: 700; color: var(--ok); }
.bm .tbd { color: var(--muted); font-style: italic; }
.champ { display: flex; gap: 12px; align-items: center; background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 14px 18px; font-weight: 700; }
.champ b { font-family: var(--f-display); font-weight: 900; font-size: 24px; color: var(--brand-ink); }

.rules ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.gallery { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); }
.tile { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; padding: 0; display: block; width: 100%; }
.tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .badge { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.tile .play { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.tile .play i { width: 46px; height: 46px; border-radius: 50%; background: #f6b210; display: grid; place-items: center; }
.uploader { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.uploader label.btn { cursor: pointer; }
.uploader input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.92); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); color: #f4f1ec; }
.lightbox .stage { display: grid; place-items: center; min-height: 0; }
.lightbox img, .lightbox video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.lightbox .btn { background: #1d1d1d; color: #f4f1ec; border-color: #3a3a3a; }
.lightbox .btn.danger { color: #f08a80; }
.lightbox .btn.danger.armed { background: #b3261e; color: #fff; }
.lightbox input[type=text] { background: #1d1d1d; color: #f4f1ec; border-color: #3a3a3a; }
.flyer-wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
#flyer { width: min(100%, 360px); height: auto; border-radius: 8px; border: 1px solid var(--line); background: #0b0b0b; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--brand); color: #111111; box-shadow: 0 0 0 2px #111111; padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.pre { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; font-size: 14px; max-height: 420px; overflow: auto; }
.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain li { padding: 8px 0; border-bottom: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>
<header class="top">
  <div class="top-in">
    <button class="brand" id="brand" type="button" aria-label="Magic Drink, início"><img src="logo-laranja.png" alt="Magic Drink" width="440" height="450"></button>
    <div class="top-title">Torneios, cartas e drinks</div>
  </div>
</header>
<main class="wrap" id="app"></main>
<nav class="fab-menu" id="nav" aria-label="Menu" hidden></nav>
<button class="fab" id="fab" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav"></button>
<div id="lb"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="qrcode.js"></script>
<script src="backend.js"></script>
<script>
const E = ENGINE;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));

// ---------- catálogo ----------
const BASES = {
  standard: { nome: 'Standard', modo: '1v1', estrutura: 'swiss', bestOf: 3, mana: ['w', 'u'], deck: 'Mínimo 60 cartas, sideboard de até 15. Apenas coleções legais no Standard.' },
  pioneer: { nome: 'Pioneer', modo: '1v1', estrutura: 'swiss', bestOf: 3, mana: ['r', 'g'], deck: 'Mínimo 60 cartas, sideboard de até 15. Coleções a partir de Return to Ravnica.' },
  modern: { nome: 'Modern', modo: '1v1', estrutura: 'swiss', bestOf: 3, mana: ['u', 'r'], deck: 'Mínimo 60 cartas, sideboard de até 15. Coleções a partir da Oitava Edição.' },

  const subs = { events: [], formats: [], regs: [] };

  },
  save(c, id, v) {
    if (S.mode !== 'db') return local.save(c, id, v);

    if (!E.stageRounds(e, st).length) return;

  const hist = [];
  rankedEvents().forEach(e => eventTotals(e).forEach(t => { if (nameKey(t.p.nome) === key) hist.push({ e, t, pl: placement(e, t.p.id) }); }));
  hist.reverse();
  const showDeck = hist.some(h => (S.admin || h.e.mostrarDecks) && h.t.p.deck);
  return `${back}<div><div class="eyebrow">Jogador · ${pos + 1}º no ranking</div><h1 class="display" style="font-size:30px">${esc(row.nome)}</h1></div>
    <div class="row"><span class="chip gold num">${row.pts} pontos</span><span class="chip num">${row.ev} ${row.ev === 1 ? 'evento' : 'eventos'}</span><span class="chip num">${row.w}-${row.l}-${row.d}</span>${row.titulos ? `<span class="chip open num">${row.titulos} ${row.titulos === 1 ? 'título' : 'títulos'}</span>` : ''}</div>
    <div class="panel" style="padding:0"><div class="tbl-wrap"><table>
    <thead><tr><th>Data</th><th>Evento</th><th>Formato</th>${showDeck ? '<th>Deck</th>' : ''}<th class="r">Colocação</th><th class="r">V-D-E</th><th class="r">Pontos</th></tr></thead>
    <tbody>${hist.map(({ e, t, pl }) => `<tr><td class="num">${e.data ? e.data.split('-').reverse().join('/') : '—'}</td><td><a href="#" data-open="${e.id}"><b>${esc(e.nome)}</b></a></td><td>${esc(e.formatoNome)}</td>${showDeck ? `<td class="muted">${S.admin || e.mostrarDecks ? esc(t.p.deck || '') : ''}</td>` : ''}<td class="r num">${pl === 1 ? '<span class="chip gold">Campeão</span>' : pl ? pl + 'º' : '—'}</td><td class="r num">${t.w}-${t.l}-${t.d}</td><td class="r num"><b>${t.mp}</b></td></tr>`).join('')}</tbody></table></div></div>`;
}

// ---------- telão ----------
function viewTelao() {
  const e = ev();
  if (!e) return '<div class="empty">Carregando o evento…</div>';
  const last = e.rounds[e.rounds.length - 1];
  const clock = last && last.inicio && e.minutos ? `<span class="clock" data-clock="${last.inicio + e.minutos * 60000}">--:--</span>` : '';
  const champ = champion(e);
  let h = `<div class="tv-head"><img src="logo-laranja.png" alt="Magic Drink"><div style="flex:1;min-width:0"><div class="eyebrow">${last ? esc(roundTitle(e, last)) : esc(fmtDate(e.data, e.hora))}</div><h1 class="display">${esc(e.nome)}</h1></div>${clock}</div>`;
  if (champ) h += `<div class="champ" style="font-size:28px"><span>Campeão</span><b>${esc(pname(e, champ))}</b></div>`;
  let left;
  if (!last) {
    left = e.checkinAberto ? `<div class="panel qr-box">${qrSvg(eventLink(e, 'checkin'))}<div class="stack"><h2 class="display" style="margin:0;font-size:clamp(24px,3vw,44px)">Faça seu check-in</h2><div style="font-size:clamp(16px,1.5vw,24px)">Aponte a câmera do celular para o QR code e toque em "Fazer check-in".</div></div></div>`
      : `<div class="panel"><div class="display" style="font-size:clamp(24px,3vw,44px)">${seatCount(e)} jogadores inscritos</div><div class="muted">As mesas aparecem aqui quando a primeira rodada começar.</div></div>`;
  } else {
    const ms = last.matches.slice().sort((a, b) => (a.bye || a.wait) - (b.bye || b.wait) || (a.mesa || 0) - (b.mesa || 0));
    left = `<div class="tv-matches">${ms.map(m => `<div class="tv-m ${E.done(m) && !m.bye && !m.wait ? 'done' : ''}"><b class="mesa">${m.bye ? 'Bye' : m.wait ? 'Aguardando' : 'Mesa ' + m.mesa}</b><div>${m.players.map(id => esc(pname(e, id))).join(m.players.length > 2 ? '<br>' : ' <span class="muted">x</span> ')}</div>${m.result ? `<div>${resultLabel(e, m)}</div>` : ''}</div>`).join('')}</div>`;
  }
  let right = '';
  if (e.rounds.length && !isElim(e)) {
    const st = E.standings(e, 'main').filter(s => !s.p.espera).slice(0, 16);
    right = `<div class="panel tv-st" style="padding:0"><div style="padding:12px 16px"><h3 style="margin:0">Classificação</h3></div><table><tbody>${st.map((s, i) => `<tr><td class="num">${i + 1}</td><td><b>${esc(s.p.nome)}</b></td><td class="r num"><b>${s.mp}</b></td><td class="r num muted">${s.w}-${s.l}-${s.d}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return h + `<div class="tv-grid" style="${right ? '' : 'grid-template-columns:minmax(0,1fr)'}"><div>${left}</div>${right ? `<div>${right}</div>` : ''}</div>
    <button class="btn sm tv-exit" data-tvexit>Sair do telão</button>`;
}

// ---------- página pública ----------
function viewHome() {
  const evs = publicEvents();

  let h = `<section class="hero">
    <div class="stack">
      <div class="eyebrow">Comunidade de Magic: The Gathering</div>
      <p>O torneio mais caótico e lendário da comunidade, onde sua habilidade de jogar é tão importante quanto sua resistência ao Elixir Sagrado.</p>

      <div class="eyebrow">Próximo evento</div>
      <div class="display" style="font-size:22px;font-weight:800">${esc(next.nome)}</div>
      <div class="muted small">${esc(fmtDate(next.data, next.hora))}</div>
      <div class="small">${esc(next.local || '')}${next.cidade ? ' · ' + esc(next.cidade) : ''}</div>
      <div class="row">${statusChip(next.status)}<span class="chip">${esc(next.formatoNome || '')}</span></div>
      <div><button class="btn primary sm" data-open="${next.id}">Ver evento</button></div>` : `<div class="eyebrow">Próximo evento</div><div class="muted">Nenhum evento publicado ainda.</div>`}
    </div></section>`;
  h += installBanner();

    : `<div class="empty">${S.admin ? 'Nenhum evento publicado. Crie um evento em Organizar e mude o status para "Inscrições abertas" para ele aparecer aqui.' : 'Nenhum evento aberto no momento. Volte em breve.'}</div>`;

  return h;
}
// ---------- instalar como app ----------
let installPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installBanner() {

  else if (isIOS()) how = '<span class="small">No Safari, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</span>';

  return `<div class="panel spread"><div class="row" style="flex-wrap:nowrap"><img src="icons/icon-192.png" alt="" width="44" height="44" style="border-radius:10px"><div class="stack" style="gap:2px"><b>Instale o app Magic Drink</b><span class="small muted">Fica na tela do celular e abre direto, em tela cheia.</span></div></div>
    <div class="row">${how}<button class="btn sm" data-act="install-hide">Agora não</button></div></div>`;
}
window.addEventListener('beforeinstallprompt', ev0 => { ev0.preventDefault(); installPrompt = ev0; render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; render(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

function evCard(e) {
  const n = seatCount(e), max = +e.vagas || 0;
  return `<button class="evcard" data-open="${e.id}">
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap">${dateBox(e.data)}
      <div class="stack" style="gap:4px;min-width:0"><h3>${esc(e.nome)}</h3><div class="muted small">${esc(e.hora || '')}${e.local ? ' · ' + esc(e.local) : ''}</div></div></div>
    <div class="row">${statusChip(e.status)}<span class="chip">${manaPips(e.mana)} ${esc(e.formatoNome || '')}</span><span class="chip">${esc((ESTRUTURAS[e.estrutura] || {}).nome || '')}</span></div>
    ${max ? `<div class="stack" style="gap:4px"><div class="bar"><i style="width:${Math.min(100, n / max * 100)}%"></i></div><div class="small muted num">${n} de ${max} vagas preenchidas</div></div>` : `<div class="small muted num">${n} inscritos</div>`}
  </button>`;
}

// ---------- página do evento ----------
function eventTabs(e) {
  const t = [['info', 'Visão geral'], ['jogadores', `Jogadores (${e.players.length})`], ['rodadas', 'Rodadas']];
  if (!isElim(e)) t.push(['classificacao', 'Classificação']);
  if (isElim(e) || (e.cutSeeds && !E.isMulti(e))) t.push(['chave', 'Chave']);
  const nm = S.mediaSub && S.mediaSub.eid === e.id ? S.media.length : 0;
  t.push(['midia', `Fotos e vídeos${nm ? ` (${nm})` : ''}`]);
  if (S.admin) t.push(['divulgar', 'Divulgar'], ['config', 'Configurar']);
  return t;
}
function viewEvent() {
  const e = ev();
  const tabs = eventTabs(e);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'info';
  let h = `<div class="evhead">
    <div class="row"><button class="btn sm" data-nav="${S.admin ? 'admin' : 'home'}">← Voltar</button>${S.admin && S.tab !== 'config' ? '<button class="btn sm primary" data-tab="config">Editar evento</button>' : ''}</div>
    <div class="row">${statusChip(e.status)}<span class="chip">${manaPips(e.mana)} ${esc(e.formatoNome)}</span><span class="chip">${esc(ESTRUTURAS[e.estrutura].nome)}</span>${e.bestOf > 1 && !E.isMulti(e) ? `<span class="chip">Melhor de ${e.bestOf}</span>` : ''}</div>
    <h1>${esc(e.nome)}</h1>
    <div class="muted">${esc(fmtDate(e.data, e.hora))}${e.local ? ' · ' + esc(e.local) : ''}${e.cidade ? ', ' + esc(e.cidade) : ''}</div>
  </div>
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}</button>`).join('')}</div>`;
  const champ = champion(e);
  if (champ) h += `<div class="champ"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v3a7 7 0 0 1-14 0Z M9 20h6 M12 14v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Campeão</span><b>${esc(pname(e, champ))}</b></div>`;
  h += ({ info: tabInfo, jogadores: tabPlayers, rodadas: tabRounds, classificacao: tabStandings, chave: tabBracket, divulgar: tabPromo, config: tabConfig, midia: tabMedia }[S.tab])(e);
  return h;
}
function champion(e) {
  if (e.estrutura === 'single') return E.elimChampion(e, 'main');
  if (e.estrutura === 'double') { if (!e.rounds.length) return null; const s = E.doubleState(e); const last = e.rounds[e.rounds.length - 1]; return s.alive.length === 1 && E.roundDone(last) ? s.alive[0] : null; }
  if (e.cutSeeds) {
    if (E.isMulti(e)) { const f = e.rounds.find(r => r.stage === 'final'); return f && f.matches[0].result && f.matches[0].result.winner || null; }
    return E.elimChampion(e, 'elim');
  }
  return null;
}

function tabInfo(e) {
  const n = seatCount(e), max = +e.vagas || 0, me = myPlayer(e);
  const myPending = S.myReg && S.myReg.eventos && S.myReg.eventos[e.id] && !me;
  let signup = '';
  if (e.status === 'inscricoes') {
    if (me && me.espera) signup = `<div class="chip gold" style="white-space:normal">Você está na lista de espera (${waitList(e).indexOf(me) + 1}º). Se alguém desistir, você entra automaticamente.</div>`;
    else if (me) signup = `<div class="chip open">Você está inscrito como ${esc(me.nome)}</div>`;
    else if (myPending) signup = `<div class="stack"><div class="chip gold">Inscrição enviada. Aguardando confirmação da organização.</div><div>${armBtn('cancel-reg', 'Cancelar minha inscrição', 'Confirmar cancelamento')}</div></div>`;
    else if (S.canWrite && S.uid) signup = `<form class="form" id="signup">
        <label class="f">Seu nome ou apelido<input type="text" id="su-nome" required maxlength="60" value="${esc(S.myReg && S.myReg.nome || '')}"></label>
        <label class="f">WhatsApp ou Instagram<input type="text" id="su-contato" maxlength="80" value="${esc(S.myReg && S.myReg.contato || '')}"></label>
        <label class="f wide">${E.isMulti(e) ? 'Comandante / deck' : 'Deck que vai jogar'} (opcional)<input type="text" id="su-deck" maxlength="80"></label>
        ${listFields(e, null)}
        ${max && n >= max ? '<p class="small wide" style="margin:0;color:var(--brand)">As vagas acabaram. Sua inscrição entra na lista de espera.</p>' : ''}
        <div class="wide"><button class="btn primary" type="submit">Quero participar</button> <span class="small muted">Só a organização vê seu contato.</span></div>
      </form>`;
    else signup = `<p class="muted small" style="margin:0">Para se inscrever, fale com a organização${e.contato ? ': <b class="mono">' + esc(e.contato) + '</b>' : ''}.</p>`;
  }
  const regras = lines(e.regras), ban = lines(e.banlist);
  const extras = e.status === 'encerrado' ? '' : checkinBlock(e, me, myPending) + pixBlock(e, me, myPending) + myListBlock(e, me, myPending);
  return `${me && e.rounds.length ? myTableCard(e, me) : ''}<div class="grid2">
    <div class="stack">
      ${e.descricao ? `<div class="panel"><p style="margin:0;white-space:pre-wrap">${esc(e.descricao)}</p></div>` : ''}
      <div class="panel rules"><h3>Regras do evento</h3>${regras.length ? `<ol>${regras.map(r => `<li>${esc(r)}</li>`).join('')}</ol>` : '<p class="muted" style="margin:0">Regras ainda não publicadas.</p>'}</div>
      ${ban.length ? `<div class="panel"><h3>Cartas banidas ou restritas</h3><ul class="list-plain">${ban.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>` : ''}
    </div>
    <div class="stack">
      <div class="panel stack">
        <div class="spread"><span class="eyebrow">Inscrições</span>${statusChip(e.status)}</div>
        ${max ? `<div class="bar"><i style="width:${Math.min(100, n / max * 100)}%"></i></div><div class="num small">${n} de ${max} vagas${waitList(e).length ? ` · ${waitList(e).length} na lista de espera` : n >= max ? ' · vagas esgotadas' : ''}</div>` : `<div class="num small">${n} inscritos</div>`}
        <table><tbody>
          <tr><td class="muted">Inscrição</td><td>${esc(money(e.taxa))}</td></tr>
          <tr><td class="muted">Formato</td><td>${esc(e.formatoNome)}</td></tr>
          <tr><td class="muted">Estrutura</td><td>${esc(ESTRUTURAS[e.estrutura].nome)}${e.rodadas ? ` · ${e.rodadas} rodadas` : ''}${+e.topCut ? (E.isMulti(e) ? ' + mesa final' : ` + top ${e.topCut}`) : ''}</td></tr>
          <tr><td class="muted">Tempo de rodada</td><td>${e.minutos ? e.minutos + ' min' : '—'}</td></tr>
          <tr><td class="muted">Pontuação</td><td class="num">Vitória ${e.pontos.v} · Empate ${e.pontos.e} · Derrota ${e.pontos.d}</td></tr>
          ${e.premiacao ? `<tr><td class="muted">Premiação</td><td style="white-space:pre-wrap">${esc(e.premiacao)}</td></tr>` : ''}
        </tbody></table>
        ${signup}
      </div>
      ${extras}
    </div>
  </div>`;
}
function listFields(e, cur) {
  const lim = evLimit(e);
  if (!needList(e) && !lim) return '';
  return `<label class="f wide">Lista do deck (uma carta por linha)${needList(e) ? '' : ' (opcional)'}<textarea id="su-lista" maxlength="6000" ${needList(e) ? 'required' : ''} placeholder="1 Sol Ring&#10;1 Command Tower&#10;…">${esc(cur && cur.lista || '')}</textarea></label>
    ${lim ? `<label class="f">Valor total do deck na LigaMagic (R$)<input type="number" id="su-valor" min="0" step="0.01" required value="${esc(cur && cur.valor != null ? cur.valor : '')}"></label>
    <p class="small muted wide" style="margin:0">Limite deste evento: ${brl(lim)}, somando o menor preço de cada carta na LigaMagic. A organização confere a lista antes do evento.</p>` : ''}`;
}
function myListBlock(e, me, pending) {
  if ((!needList(e) && !evLimit(e)) || (!me && !pending) || e.rounds.length) return '';
  const cur = me ? deckInfo(e, me) : myRegEv(e) || {};
  return `<div class="panel"><details ${cur.lista ? '' : 'open'}><summary>Sua lista do deck${cur.valor != null && cur.valor !== '' ? ' · ' + brl(cur.valor) : ''}</summary>
    <form class="form" id="my-list" style="margin-top:10px">${listFields(e, cur)}<div class="wide"><button class="btn primary" type="submit">Salvar lista</button></div></form></details></div>`;
}
function checkinBlock(e, me, pending) {
  if (!e.checkinAberto) return '';
  const mine = myRegEv(e) || {};
  if (me && checkedIn(e, me) || (!me && mine.checkin)) return `<div class="panel"><span class="chip open">Check-in feito${me ? ' · ' + esc(me.nome) : ''}</span></div>`;

function pixBlock(e, me, pending) {

function myTableCard(e, me) {

  const m = r.matches.find(x => x.players.includes(me.id));

    <div class="muted">${m.bye ? 'Vitória automática nesta rodada.' : m.wait ? 'Você avança sem jogar nesta rodada.' : 'Contra ' + others.join(', ')}</div>
    ${!m.bye && !m.wait ? `<div style="margin-top:10px">${m.result ? resultLabel(e, m) : reportInput(e, r, m)}</div>` : ''}</div>`;
}

function tabPlayers(e) {
  const pend = S.admin ? pendingFor(e) : [];
  const started = e.rounds.length > 0;
  let h = '';
  if (S.admin) {
    h += `<div class="grid2">
      <div class="panel stack"><h3 style="margin:0">Adicionar jogadores</h3>
        <label class="f">Um por linha. Use "Nome ; deck" para registrar o deck.<textarea id="add-players" placeholder="Ana ; Mono Red&#10;Bruno ; Atraxa"></textarea></label>

      </div>

        ${pend.length ? `<ul class="list-plain">${pend.map(p => `<li class="spread"><div style="min-width:0"><b>${esc(p.nome)}</b> <span class="muted small">${esc(p.deck || '')}</span><div class="small mono muted">${esc(p.contato || '')}</div>
          ${p.pix ? '<span class="chip gold">informou Pix</span> ' : ''}${evLimit(e) ? valorChip(e, p.valor) : ''}${p.lista ? `<details><summary class="small">ver lista</summary><div class="listbox">${esc(p.lista)}</div></details>` : ''}</div>

function listCell(e, p) {

function checkinAdmin(e) {

    <div class="small mono muted" id="copy-checkin" style="word-break:break-all">${esc(link)}</div>

function resultLabel(e, m) {
  if (m.bye) return '<span class="chip gold">Bye</span>';
  if (m.wait) return '<span class="chip">Aguarda</span>';
  if (!m.result) return '<span class="chip draft">Em jogo</span>';
  if (m.result.winner) return `<span class="chip open">Venceu: ${esc(pname(e, m.result.winner))}</span>`;
  if (m.result.draw) return '<span class="chip">Empate</span>';
  return `<span class="chip ${m.result.a === m.result.b ? '' : 'open'} num">${m.result.a}-${m.result.b}${m.result.d ? '-' + m.result.d : ''}</span>`;
}
const resultValue = res => res ? (res.winner ? 'w:' + res.winner : res.draw ? 'draw' : `${res.a}-${res.b}-${res.d || 0}`) : '';
function parseResult(v) {
  if (!v) return null; if (v === 'draw') return { draw: true }; if (v.startsWith('w:')) return { winner: v.slice(2) };
  const [a, b, d] = v.split('-').map(Number); return { a, b, d };
}
const repKey = (r, m) => r.n + ':' + m.id;
// resultados informados pelos próprios jogadores da mesa (ficam na inscrição de cada um)
function reportsFor(e, r, m) {
  const valid = resultOptions(e, r, m).map(o => o[0]), out = [];
  m.players.forEach(id => {
    const p = e.players.find(x => x.id === id); if (!p || !p.regUid) return;
    const x = regEv(e, p.regUid), v = x && x.reports && x.reports[repKey(r, m)];
    if (v && valid.includes(v)) out.push({ p, v });
  });
  return out;
}
function agreedReport(e, r, m) { const reps = reportsFor(e, r, m); return reps.length && reps.every(x => x.v === reps[0].v) ? reps[0].v : null; }
const optLabel = (e, r, m, v) => { const o = resultOptions(e, r, m).find(x => x[0] === v); return o ? o[1] : v; };
function reportInput(e, r, m) {
  if (r !== e.rounds[e.rounds.length - 1] || !S.uid) return resultLabel(e, m);
  const mine = (myRegEv(e) || {}).reports || {}, v = mine[repKey(r, m)] || '';
  return `<div class="report stack" style="gap:4px"><select data-report="${r.n}:${m.id}" aria-label="Informar resultado da sua mesa"><option value="">Informar resultado…</option>${resultOptions(e, r, m).map(([k, l]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
    <span class="muted">${v ? 'Enviado. Aguardando a organização confirmar.' : 'Informe o resultado quando a partida terminar.'}</span></div>`;
}
function reportAdmin(e, r, m) {
  if (m.result || m.bye || m.wait) return '';
  const reps = reportsFor(e, r, m); if (!reps.length) return '';
  const ok = agreedReport(e, r, m);
  return `<div class="report stack" style="gap:4px">${reps.map(x => `<span>${esc(x.p.nome)} informou: <b>${esc(optLabel(e, r, m, x.v))}</b></span>`).join('')}
    ${ok ? `<div><button class="btn sm primary" data-act="confirm:${r.n}:${m.id}">Confirmar</button></div>` : '<span class="chip bad">Resultados diferentes</span>'}</div>`;
}
function resultOptions(e, r, m) {
  const elim = r.stage === 'elim' || isElim(e);
  let opts;
  if (m.players.length > 2) opts = m.players.map(id => [`w:${id}`, `Vitória de ${pname(e, id)}`]).concat(elim ? [] : [['draw', 'Empate (todos)']]);
  else {
    const [a, b] = m.players.map(id => pname(e, id));
    const bo = +e.bestOf || 3;
    const list = bo >= 3 ? [['2-0-0', `${a} 2-0`], ['2-1-0', `${a} 2-1`], ['1-0-0', `${a} 1-0`], ['1-0-1', `${a} 1-0-1`], ['0-2-0', `${b} 2-0`], ['1-2-0', `${b} 2-1`], ['0-1-0', `${b} 1-0`], ['0-1-1', `${b} 1-0-1`], ['1-1-0', 'Empate 1-1'], ['1-1-1', 'Empate 1-1-1'], ['0-0-0', 'Empate 0-0 (ID)']]
      : [['1-0-0', `Vitória de ${a}`], ['0-1-0', `Vitória de ${b}`], ['0-0-1', 'Empate']];
    opts = elim ? list.filter(([v]) => { const [x, y] = v.split('-').map(Number); return x !== y; }) : list;
  }
  return opts;
}
function resultInput(e, r, m) {
  if (m.bye || m.wait) return resultLabel(e, m);
  const val = resultValue(m.result), opts = resultOptions(e, r, m);
  return `<select data-result="${r.n}:${m.id}" aria-label="Resultado da mesa ${m.mesa}"><option value="">Resultado…</option>${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
}
function swapSel(e, r, m, i) {
  const cur = m.players[i];
  return `<select data-swap="${r.n}:${m.id}:${i}" aria-label="Trocar jogador" style="width:auto;max-width:100%">${e.players.filter(p => (!p.dropped && !p.espera) || p.id === cur).map(p => `<option value="${p.id}" ${p.id === cur ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select>`;
}
function matchRow(e, r, m) {
  const me = myPlayer(e); const w = E.winnerOf(m);
  const mine = me && m.players.includes(me.id);
  let who;
  const editable = S.admin && S.editPairs && r === e.rounds[e.rounds.length - 1];
  if (editable) who = `<div class="pod">${m.players.map((id, i) => swapSel(e, r, m, i)).join('<span class="x muted small" style="align-self:center">vs</span>')}</div>`;
  else if (m.players.length > 2) who = `<div class="pod">${m.players.map((id, i) => `<span class="${w === id ? 'pl win' : ''}"><small>${i + 1}º</small>${esc(pname(e, id))}</span>`).join('')}</div>`;
  else if (m.players.length === 1) who = `<div class="vs"><span class="pl">${esc(pname(e, m.players[0]))}</span></div>`;
  else who = `<div class="vs"><span class="pl ${w === m.players[0] ? 'win' : ''}">${esc(pname(e, m.players[0]))}</span><span class="x">vs</span><span class="pl ${w === m.players[1] ? 'win' : ''}">${esc(pname(e, m.players[1]))}</span></div>`;
  const tag = m.bracket ? ({ W: 'Vencedores', L: 'Perdedores', F: 'Grande final' }[m.bracket]) : m.pod ? `Draft ${m.pod}` : '';
  return `<div class="match ${mine ? 'me' : ''}"><div class="mesa">${m.bye || m.wait ? '—' : `Mesa<b>${m.mesa}</b>`}</div>

    <div class="stack" style="gap:6px;align-items:flex-end">${S.admin ? resultInput(e, r, m) + reportAdmin(e, r, m) : mine && !m.result && !m.bye && !m.wait ? reportInput(e, r, m) : resultLabel(e, m)}</div></div>`;

function roundTitle(e, r) {
  if (r.stage === 'final') return 'Mesa final';
  if (r.stage === 'elim') { const rs = E.stageRounds(e, 'elim'); return E.elimLabel(E.elimTotalRounds(e.cutSeeds.length), rs.indexOf(r)); }
  if (e.estrutura === 'single') { const rs = E.stageRounds(e, 'main'); return E.elimLabel(E.elimTotalRounds((e.seeds || []).length), rs.indexOf(r)); }

}
function tabRounds(e) {
  const last = e.rounds[e.rounds.length - 1];

  if (S.admin) {
    const mainCount = E.stageRounds(e, 'main').length;

    h += `<div class="panel spread"><div class="stack" style="gap:2px"><b>${e.rounds.length ? `${roundTitle(e, last)} ${E.roundDone(last) ? 'concluída' : 'em andamento'}` : 'Pronto para começar'}</b>
      <span class="small muted">${planned && !isElim(e) ? `Fase classificatória: ${mainCount} de ${planned} rodadas` : ESTRUTURAS[e.estrutura].desc}</span></div>
      <div class="row">
        ${e.estrutura === 'draft' && !e.rounds.length ? `<button class="btn" data-act="draft-pods">${e.players.some(p => p.pod) ? 'Sortear mesas de draft de novo' : 'Sortear mesas de draft'}</button>` : ''}
        ${canCut ? `<button class="btn primary" data-act="cut">${E.isMulti(e) ? 'Gerar mesa final' : `Iniciar top ${e.topCut}`}</button>` : ''}
        ${!finished && !canCut ? `<button class="btn primary" data-act="next-round" ${e.estrutura === 'draft' && !e.players.some(p => p.pod) ? 'disabled' : ''}>${e.rounds.length ? 'Gerar próxima rodada' : 'Gerar 1ª rodada'}</button>` : ''}
        ${last && !E.roundDone(last) && last.matches.filter(m => !E.done(m) && agreedReport(e, last, m)).length ? `<button class="btn primary" data-act="confirm-all">${(n => n === 1 ? 'Confirmar 1 resultado informado' : `Confirmar ${n} resultados informados`)(last.matches.filter(m => !E.done(m) && agreedReport(e, last, m)).length)}</button>` : ''}

      </div>

  });
  return h;
}

function tabStandings(e) {

    <tbody>${rows.map((s, i) => `<tr class="${me && me.id === s.p.id ? 'me' : ''}"><td class="num">${i + 1}</td><td><b>${esc(s.p.nome)}</b>${s.p.dropped ? ' <span class="chip">desistiu</span>' : ''}</td><td class="r num"><b>${s.mp}</b></td><td class="r num">${s.w}-${s.l}-${s.d}</td>

function tabBracket(e) {
  const stage = e.cutSeeds && !isElim(e) ? 'elim' : 'main';
  const rs = E.stageRounds(e, stage);
  if (e.estrutura === 'double') {
    if (!rs.length) return `<div class="empty">A chave aparece quando a primeira rodada for gerada.</div>`;
    const st = E.doubleState(e);
    const col = (br, title) => {
      const rounds = rs.map((r, i) => ({ i, ms: r.matches.filter(m => m.bracket === br && !m.wait) })).filter(x => x.ms.length);
      if (!rounds.length) return '';
      return `<div class="stack"><h3 class="display" style="font-size:18px">${title}</h3><div class="bracket">${rounds.map(x => `<div class="bcol"><h4>Rodada ${x.i + 1}</h4>${x.ms.map(m => bm(e, m)).join('')}</div>`).join('')}</div></div>`;
    };
    return `<div class="panel stack"><div class="row small"><span class="chip open">${st.wb.length} sem derrotas</span><span class="chip gold">${st.lb.length} com uma derrota</span><span class="chip">${e.players.length - st.alive.length} eliminados</span></div>
      ${col('W', 'Chave dos vencedores')}${col('L', 'Chave dos perdedores')}${col('F', 'Grande final')}</div>`;
  }
  const seeds = stage === 'elim' ? e.cutSeeds : e.seeds;
  if (!seeds) return `<div class="empty">A chave aparece quando a primeira rodada for gerada.</div>`;
  const total = E.elimTotalRounds(seeds.length);
  let cols = '';
  for (let i = 0; i < total; i++) {
    const r = rs[i];
    const count = Math.pow(2, total - i - 1);
    const ms = r ? r.matches.slice().sort((a, b) => a.slot - b.slot).map(m => bm(e, m)) : Array.from({ length: count }, () => `<div class="bm"><div class="tbd">a definir</div><div class="tbd">a definir</div></div>`);
    cols += `<div class="bcol"><h4>${E.elimLabel(total, i)}</h4>${ms.join('')}</div>`;
  }
  return `<div class="panel"><div class="bracket">${cols}</div></div>`;
}
function bm(e, m) {
  const w = E.winnerOf(m);
  if (m.bye) return `<div class="bm"><div class="w"><span>${esc(pname(e, m.players[0]))}</span><span class="small">bye</span></div><div class="tbd">—</div></div>`;
  const sc = (i) => m.result && !m.result.winner ? (i ? m.result.b : m.result.a) : '';
  return `<div class="bm">${m.players.map((id, i) => `<div class="${w === id ? 'w' : ''}"><span>${esc(pname(e, id))}</span><span class="num">${sc(i)}</span></div>`).join('')}</div>`;
}

// ---------- fotos e vídeos ----------
function watchMedia(eid) {
  if (S.mode !== 'db' || (S.mediaSub && S.mediaSub.eid === eid)) return;
  if (S.mediaSub) S.mediaSub.unsub();

    <p class="muted" style="margin:0;max-width:70ch">Monte suas regras da casa uma vez e reaproveite em cada evento. Ao criar um evento, as regras do formato são copiadas para ele e podem ser ajustadas só naquele evento.</p>`;

function formatEditor(f) {
  return `<div class="panel"><h3>${S.formatId === 'new' ? 'Novo formato' : 'Editar formato'}</h3><form class="form" id="fmt-form">

    <label class="f">Estrutura padrão<select id="ff-estrutura">${Object.entries(ESTRUTURAS).map(([k, s]) => `<option value="${k}" ${f.estrutura === k ? 'selected' : ''}>${s.nome}</option>`).join('')}</select></label>
    <label class="f">Melhor de<select id="ff-bo">${[1, 3, 5].map(n => `<option ${+f.bestOf === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>

    <label class="f">Minutos por rodada<input type="number" id="ff-min" min="0" max="240" value="${esc(f.minutos || 50)}"></label>
    <label class="f">Valor máximo do deck em R$ (0 = sem limite)<input type="number" id="ff-limite" min="0" step="1" value="${esc(limitOf(f, f.nome))}"></label>
    <label class="f">Pontos V / E / D<input type="text" id="ff-pts" value="${esc([f.pontos.v, f.pontos.e, f.pontos.d].join(' / '))}" placeholder="3 / 1 / 0"></label>
    <label class="f wide">Regras (uma por linha)<textarea id="ff-regras" style="min-height:180px">${esc(f.regras)}</textarea></label>
    <label class="f wide">Cartas banidas ou restritas (uma por linha)<textarea id="ff-banlist">${esc(f.banlist)}</textarea></label>
    <div class="wide row"><button class="btn primary" type="submit">Salvar formato</button><button class="btn" type="button" data-act="cancel-fmt">Cancelar</button></div>

function formatFromBase(k) {
  const b = BASES[k];
  const regras = [b.deck,
    b.modo === 'multi' ? 'Ordem de turno definida pelos assentos sorteados na mesa.' : 'Partidas em melhor de ' + b.bestOf + '. O perdedor da partida anterior escolhe quem começa.',
    b.modo === 'multi' ? 'Ao fim do tempo, o jogador ativo termina o turno e a partida é empate se não houver vencedor.' : 'Ao fim do tempo, o jogador ativo termina o turno e são jogados mais 5 turnos (turno 0 + 5).',
    'Atrasos de mais de 10 minutos contam como derrota na rodada.',
    'Decisões de juiz da organização são finais.'].filter(Boolean).join('\n');
  return { id: E.rid(), nome: b.nome + (k === 'custom' ? '' : ' da casa'), base: k, modo: b.modo, estrutura: b.estrutura, bestOf: b.bestOf, podSize: b.podSize || (b.estrutura === 'draft' ? 8 : 4),
    minutos: b.modo === 'multi' ? 75 : 50, pontos: b.modo === 'multi' ? { v: 3, e: 1, d: 0 } : { v: 3, e: 1, d: 0 }, regras, banlist: '' };
}

// ---------- eventos de interface ----------
function readNum(id, d = 0) { const el = $('#' + id); if (!el) return d; const n = parseFloat(el.value); return isNaN(n) ? d : n; }
function readStr(id) { const el = $('#' + id); return el ? el.value.trim() : ''; }
function readList(e) {
  const out = {};

  if ($('#su-valor')) {
    const v = parseFloat($('#su-valor').value), lim = evLimit(e);

document.addEventListener('click', async ev0 => {
  if (ev0.target.closest('#fab')) { S.menuOpen = !S.menuOpen; renderNav(); if (S.menuOpen) { const b = $('#nav button'); if (b) b.focus(); } return; }
  if (S.menuOpen) { S.menuOpen = false; renderNav(); }
  const t = ev0.target.closest('[data-nav],[data-open],[data-tab],[data-act],[data-approve],[data-drop],[data-editfmt],[data-copy],[data-lightbox],[data-lbnav],[data-lbclose],[data-perfil],[data-tvexit],#brand');
  if (!t) return;
  if (t.id === 'brand') { S.view = 'home'; render(); return; }
  if (t.dataset.nav) { S.view = t.dataset.nav; S.newEvent = false; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.open) { ev0.preventDefault(); S.view = 'event'; S.eventId = t.dataset.open; S.tab = 'info'; watchMedia(S.eventId); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.perfil) { ev0.preventDefault(); S.view = 'perfil'; S.perfil = t.dataset.perfil; render(); window.scrollTo(0, 0); return; }
  if (t.hasAttribute('data-tvexit')) { if (/^#telao\//.test(location.hash)) history.replaceState(null, '', location.pathname); S.view = ev() ? 'event' : 'home'; render(); return; }
  if (t.dataset.lightbox) { S.lightbox = t.dataset.lightbox; render(); return; }
  if (t.dataset.lbnav) { const i = S.media.findIndex(m => m.id === S.lightbox) + +t.dataset.lbnav; if (S.media[i]) S.lightbox = S.media[i].id; render(); return; }
  if (t.hasAttribute('data-lbclose')) { S.lightbox = null; render(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
  if (t.dataset.editfmt) { S.formatId = t.dataset.editfmt; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.copy) {
    const txt = $('#copy-' + t.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(txt); toast('Texto copiado'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($('#copy-' + t.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto selecionado. Use Ctrl+C para copiar.'); }
    return;
  }
  if (t.dataset.approve) {
    const uid = t.dataset.approve, reg = S.regs[uid];
    return mutate(e => {
      const x = reg.eventos[e.id];
      const np = addPlayer(e, { id: E.rid(), nome: reg.nome, deck: x.deck || '', regUid: uid, contato: reg.contato || '', lista: x.lista || '', valor: x.valor });
      if (np.espera) toast(`Vagas esgotadas: ${np.nome} entrou na lista de espera.`);
    });
  }
  if (t.dataset.drop) return mutate(e => { const p = e.players.find(x => x.id === t.dataset.drop); p.dropped = !p.dropped; });

  const act = t.dataset.act;
  if (!act) return;
  if (act === 'logout') { try { await window.MD_AUTH.signOut(); } catch (err) {} location.reload(); return; }
  if (act === 'save-flyer') {
    const cv = $('#flyer'), e = ev(); if (!cv || !e) return;
    await drawFlyer(cv, e, S.flyerKind || 'post');
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const filename = 'flyer-' + (e.nome || 'magic-drink').normalize('NFD').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.png';
    if (await saveFile(blob, filename)) toast('Flyer salvo');
    return;
  }
  if (act === 'checkin-open' || act === 'checkin-close') return mutate(e => { e.checkinAberto = act === 'checkin-open'; });
  if (act === 'drop-absent') { if (!armed(act)) return; return mutate(e => { let n = 0; e.players.forEach(p => { if (!p.dropped && !checkedIn(e, p)) { p.dropped = true; n++; } }); if (!n) return false; }).then(() => toast('Quem não fez check-in saiu dos pareamentos. Dá para reativar na lista.')); }
  if (act === 'checkin') { const e = ev(); if (await saveMyRegEv(e, { checkin: Date.now() })) toast('Check-in feito. Bom jogo!'); return; }
  if (act === 'checkin-name') {
    const pid = readStr('ci-player'), e = ev(); if (!pid) { toast('Escolha seu nome na lista.'); return; }
    const p = e.players.find(x => x.id === pid);
    if (await saveMyRegEv(e, { checkin: Date.now(), checkinPlayer: pid }, p && p.nome)) toast('Check-in feito. Bom jogo!');
    return;
  }
  if (act === 'paid-informed') { const e = ev(); if (await saveMyRegEv(e, { pagoInformado: Date.now() })) toast('Obrigado! A organização vai confirmar o pagamento.'); return; }
  if (act === 'confirm-all') return mutate(e => {
    const r = e.rounds[e.rounds.length - 1]; let n = 0;
    r.matches.forEach(m => { if (E.done(m)) return; const v = agreedReport(e, r, m); if (v) { m.result = parseResult(v); n++; } });
    if (!n) return false;
  }).then(() => toast('Resultados confirmados'));
  if (act.startsWith('confirm:')) {
    const [, rn, mid] = act.split(':');
    return mutate(e => { const r = e.rounds.find(x => x.n === +rn), m = r && r.matches.find(x => x.id === mid); const v = m && agreedReport(e, r, m); if (!v) return false; m.result = parseResult(v); }).then(() => toast('Resultado confirmado'));
  }
  if (act === 'install') { if (!installPrompt) return; installPrompt.prompt(); try { await installPrompt.userChoice; } catch (err) {} installPrompt = null; render(); return; }
  if (act === 'install-hide') { S.installHidden = true; try { sessionStorage.setItem('md-install-hide', '1'); } catch (err) {} render(); return; }
  if (act === 'backup') {
    const data = { app: 'magic-drink', versao: 1, exportadoEm: new Date().toISOString(), events: S.events, formats: S.formats, regs: S.regs, media: {} };
    if (S.mode === 'db') for (const id of Object.keys(S.events)) {
      try { const snap = await S.db.collection('events/' + id + '/media').get(); if (snap.docs.length) data.media[id] = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); } catch (err) {}
    }
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    if (await saveFile(blob, 'magic-drink-copia-' + new Date().toISOString().slice(0, 10) + '.json')) toast('Cópia de segurança salva');
    return;
  }
  if (act === 'restore-cancel') { S.restore = null; render(); return; }
  if (act === 'restore-go') {
    if (!armed(act)) return;
    const d = S.restore; S.restore = null; render();
    try {
      for (const [id, v] of Object.entries(d.formats || {})) await store.save('formats', id, v);
      for (const [id, v] of Object.entries(d.events || {})) await store.save('events', id, v);
      for (const [id, v] of Object.entries(d.regs || {})) await store.save('regs', id, v);
      if (S.mode === 'db') for (const [eid, ms] of Object.entries(d.media || {})) for (const [mid, v] of Object.entries(ms)) await S.db.doc('events/' + eid + '/media/' + mid).set(v);
      toast('Cópia restaurada');
    } catch (err) { toast('A restauração parou no meio. Tente de novo.'); }
    return;
  }
  if (act === 'edit-pairs') { S.editPairs = !S.editPairs; render(); return; }
  if (act === 'new-event') { S.view = 'admin'; S.newEvent = true; render(); window.scrollTo(0, 0); return; }
  if (act === 'cancel-new') { S.newEvent = false; render(); return; }
  if (act === 'cancel-fmt') { S.formatId = null; render(); return; }
  if (act === 'new-format') { S.formatDraft = formatFromBase($('#new-base').value); S.formatId = 'new'; render(); return; }
  if (act === 'add-players') {
    const rows = lines($('#add-players').value);
    if (!rows.length) { toast('Digite pelo menos um nome.'); return; }
    $('#add-players').value = '';
    return mutate(e => {
      rows.forEach(r => { const [nome, deck] = r.split(';').map(s => s.trim()); if (nome) addPlayer(e, { id: E.rid(), nome: nome.slice(0, 60), deck: (deck || '').slice(0, 80) }); });
      if (e.estrutura === 'roundrobin' && e.rounds.length) toast('Em todos contra todos, quem entra depois do início não é incluído na tabela.');
    }).then(() => toast(rows.length === 1 ? 'Jogador adicionado' : `${rows.length} jogadores adicionados`));
  }
  if (act === 'next-round') return mutate(e => {
    const r = E.nextRound(e); e.rounds.push(r);
    if (!+e.rodadas && !isElim(e)) e.rodadas = E.suggestedRounds(e.players.filter(p => !p.dropped).length, e.estrutura);
    if (e.status !== 'andamento' && e.status !== 'encerrado') e.status = 'andamento';
  }).then(() => { S.tab = 'rodadas'; render(); });
  if (act === 'cut') return mutate(e => { e.rounds.push(E.startCut(e)); });
  if (act === 'draft-pods') return mutate(e => { E.assignDraftPods(e); }).then(() => toast('Mesas de draft sorteadas'));
  if (act === 'clock') return mutate(e => { e.rounds[e.rounds.length - 1].inicio = Date.now(); });
  if (act === 'undo-round') { if (!armed(act)) return; return mutate(e => {
    const r = e.rounds.pop();
    if (r.stage === 'elim' && !E.stageRounds(e, 'elim').length || r.stage === 'final') delete e.cutSeeds;
    if (!e.rounds.length) { delete e.seeds; delete e.rrOrder; }
  }); }
  if (act === 'del-event') { if (!armed(act)) return; const id = S.eventId; S.view = 'admin'; delete S.events[id]; render(); return store.remove('events', id); }
  if (act === 'cancel-reg') { if (!armed(act)) return; const r = clone(S.myReg); delete r.eventos[S.eventId]; S.myReg = r; render(); return store.save('regs', S.uid, r); }
  if (act.startsWith('rm:')) { if (!armed(act)) return; const id = act.slice(3); return mutate(e => { e.players = e.players.filter(p => p.id !== id); }); }
  if (act.startsWith('reject:')) { if (!armed(act)) return; const uid = act.slice(7); const r = clone(S.regs[uid]); delete r.eventos[S.eventId]; S.regs[uid] = r; render(); return store.save('regs', uid, r); }
  if (act.startsWith('delmedia:')) {
    if (!armed(act)) return; const id = act.slice(9), m = S.media.find(x => x.id === id); if (!m) return;
    S.lightbox = null; render();
    try { await S.assets.delete(m.asset); } catch (err) {}
    try { await S.db.doc('events/' + S.eventId + '/media/' + id).delete(); toast('Mídia apagada'); } catch (err) { toast('Não foi possível apagar.'); }
    return;
  }
  if (act.startsWith('delfmt:')) { if (!armed(act)) return; const id = act.slice(7); delete S.formats[id]; if (S.formatId === id) S.formatId = null; render(); return store.remove('formats', id); }
});

document.addEventListener('change', ev0 => {
  const t = ev0.target;
  if (t.dataset.paid) return mutate(e => { const p = e.players.find(x => x.id === t.dataset.paid); p.pago = t.checked; });
  if (t.dataset.checkin) return mutate(e => { const p = e.players.find(x => x.id === t.dataset.checkin); p.checkin = t.checked; });
  if (t.dataset.report) {
    const e = ev(), key = t.dataset.report, reports = Object.assign({}, (myRegEv(e) || {}).reports);
    if (t.value) reports[key] = t.value; else delete reports[key];
    return saveMyRegEv(e, { reports }).then(ok => { if (ok) toast(t.value ? 'Resultado enviado. A organização vai confirmar.' : 'Resultado retirado.'); });
  }
  if (t.dataset.result) {
    const [rn, mid] = t.dataset.result.split(':'), v = t.value;
    return mutate(e => {
      const m = e.rounds.find(r => r.n === +rn).matches.find(x => x.id === mid);
      m.result = parseResult(v);
      const later = e.rounds.findIndex(r => r.n === +rn) < e.rounds.length - 1;
      if (later) toast('Resultado alterado numa rodada anterior. Os pareamentos já gerados não mudam.');
    });
  }
  if (t.hasAttribute && t.hasAttribute('data-restore')) {
    const file = t.files[0]; t.value = ''; if (!file) return;
    file.text().then(txt => {
      let d; try { d = JSON.parse(txt); } catch (err) { d = null; }
      if (!d || d.app !== 'magic-drink') { toast('Este arquivo não é uma cópia do Magic Drink.'); return; }
      S.restore = d; render();
    });
    return;
  }
  if (t.hasAttribute && t.hasAttribute('data-upload')) { const files = [...t.files]; t.value = ''; if (files.length) uploadMedia(files); return; }
  if (t.dataset.legenda) {
    const id = t.dataset.legenda;
    return S.db.doc('events/' + S.eventId + '/media/' + id).update({ legenda: t.value.trim() }).then(() => toast('Legenda salva'), () => toast('Não foi possível salvar a legenda.'));
  }
  if (t.dataset.pname || t.dataset.pdeck) {
    const id = t.dataset.pname || t.dataset.pdeck, v = t.value.trim();
    if (t.dataset.pname && !v) { toast('O nome não pode ficar vazio.'); return; }
    return mutate(e => { const p = e.players.find(x => x.id === id); if (t.dataset.pname) p.nome = v; else p.deck = v; }).then(() => toast('Jogador atualizado'));
  }
  if (t.dataset.swap) {
    const [rn, mid, idx] = t.dataset.swap.split(':'), nid = t.value;
    return mutate(e => {
      const r = e.rounds.find(x => x.n === +rn), m = r.matches.find(x => x.id === mid), old = m.players[+idx];
      const other = r.matches.find(x => x.players.includes(nid));
      if (other) { const j = other.players.indexOf(nid); other.players[j] = old; other.result = other.bye ? other.result : null; }
      m.players[+idx] = nid; if (!m.bye) m.result = null;
    }).then(() => toast('Mesas atualizadas. Confira os resultados das mesas alteradas.'));
  }
  if (t.id === 'flyer-kind') { S.flyerKind = t.value; paintFlyer(); return; }
  if (t.id === 'ff-modo' && t.value === 'multi') { const s = $('#ff-estrutura'); if (s) s.value = 'pods'; }
});

document.addEventListener('submit', async ev0 => {
  ev0.preventDefault();
  const f = ev0.target;
  if (f.id === 'login-form') {
    let r;
    try { r = await window.MD_AUTH.signIn(readStr('lg-email'), $('#lg-senha').value); }
    catch (err) { S.loginMsg = /confirm/i.test(err && err.message || '') ? 'Este e-mail ainda não foi confirmado no Supabase.' : 'E-mail ou senha incorretos.'; render(); return; }
    if (r && r.admin) { location.reload(); return; }
    S.loginMsg = r && r.error
      ? 'Login feito, mas o site não conseguiu verificar a permissão de organizador (' + r.error + '). Confira se o setup.sql rodou até o fim.'
      : 'Login feito como ' + (r && r.email || 'este e-mail') + ', mas ele não está na lista de organizadores. Rode no SQL Editor o comando que adiciona o e-mail na tabela admins.';
    try { await window.MD_AUTH.signOut(); } catch (err) {}
    render();
    return;
  }
  if (f.id === 'my-list') {
    const e = ev(), x = readList(e); if (!x) return;
    document.activeElement && document.activeElement.blur();
    if (await saveMyRegEv(e, x)) toast('Lista salva');
    return;
  }
  if (f.id === 'signup') {
    const nome = readStr('su-nome'); if (!nome) return;
    const lst = readList(ev()); if (!lst) return;
    const r = clone(S.myReg || { eventos: {} }); r.nome = nome; r.contato = readStr('su-contato'); r.eventos = r.eventos || {};
    r.eventos[S.eventId] = Object.assign({}, r.eventos[S.eventId], { deck: readStr('su-deck'), em: Date.now() }, lst);
    S.myReg = r; document.activeElement && document.activeElement.blur(); render();
    try { await store.save('regs', S.uid, r); toast('Inscrição enviada. A organização vai confirmar.'); } catch (e) {}
    return;
  }
  if (f.id === 'new-event') {
    const sel = readStr('ef-formato');
    const fm = sel.startsWith('base:') ? formatFromBase(sel.slice(5)) : S.formats[sel];
    if (!fm) { toast('Crie ou escolha um formato primeiro.'); return; }
    const e = {
      id: E.rid(), nome: readStr('ef-nome'), data: readStr('ef-data'), hora: readStr('ef-hora'), local: readStr('ef-local'), cidade: readStr('ef-cidade'),
      vagas: readNum('ef-vagas'), taxa: readNum('ef-taxa'), contato: readStr('ef-contato'), premiacao: readStr('ef-premiacao'), descricao: readStr('ef-descricao'),
      pixChave: readStr('ef-pix'), pixNome: readStr('ef-pixnome'), pixCidade: readStr('ef-pixcidade'),
      limiteValor: limitOf(fm, fm.nome), pedirLista: limitOf(fm, fm.nome) > 0,
      formatoId: fm.id, formatoNome: fm.nome, base: fm.base, mana: (BASES[fm.base] || BASES.custom).mana, modo: fm.modo, estrutura: fm.estrutura, bestOf: +fm.bestOf,
      podSize: +fm.podSize || 4, minutos: +fm.minutos || 50, pontos: clone(fm.pontos), regras: fm.regras, banlist: fm.banlist,
      rodadas: 0, topCut: 0, status: 'rascunho', mostrarDecks: fm.modo === 'multi', players: [], rounds: [], criadoEm: Date.now(),
    };
    document.activeElement && document.activeElement.blur();
    S.newEvent = false; S.view = 'event'; S.eventId = e.id; S.tab = 'config'; watchMedia(e.id);
    await saveEvent(e); toast('Evento criado como rascunho. Revise as regras e abra as inscrições.');
    return;
  }
  if (f.id === 'edit-event') {
    document.activeElement && document.activeElement.blur();
    return mutate(e => {
      Object.assign(e, { nome: readStr('ef-nome'), data: readStr('ef-data'), hora: readStr('ef-hora'), local: readStr('ef-local'), cidade: readStr('ef-cidade'),
        status: readStr('ef-status'), rodadas: readNum('ef-rodadas'), topCut: readNum('ef-top'), bestOf: readNum('ef-bo', 3), podSize: readNum('ef-pod', 4),
        minutos: readNum('ef-min'), pontos: { v: readNum('ef-pv', 3), e: readNum('ef-pe', 1), d: readNum('ef-pd', 0) }, vagas: readNum('ef-vagas'), taxa: readNum('ef-taxa'),
        contato: readStr('ef-contato'), premiacao: readStr('ef-premiacao'), descricao: readStr('ef-descricao'), regras: $('#ef-regras').value, banlist: $('#ef-banlist').value,
        mostrarDecks: $('#ef-decks').checked, pixChave: readStr('ef-pix'), pixNome: readStr('ef-pixnome'), pixCidade: readStr('ef-pixcidade'),
        pedirLista: $('#ef-lista').checked, limiteValor: readNum('ef-limite', 0), foraRanking: $('#ef-fora').checked });
      const rf = readStr('ef-reformato');
      if (rf) {
        const fm = rf.startsWith('base:') ? formatFromBase(rf.slice(5)) : S.formats[rf];
        Object.assign(e, { formatoId: fm.id, formatoNome: fm.nome, base: fm.base, mana: (BASES[fm.base] || BASES.custom).mana, bestOf: +fm.bestOf,
          podSize: +fm.podSize || 4, minutos: +fm.minutos || 50, pontos: clone(fm.pontos), regras: fm.regras, banlist: fm.banlist,
          limiteValor: limitOf(fm, fm.nome), pedirLista: limitOf(fm, fm.nome) > 0 || e.pedirLista });
        if (!e.rounds.length) { e.estrutura = fm.estrutura; e.modo = fm.modo; }
      } else if (!e.rounds.length) { e.estrutura = readStr('ef-estrutura'); if (e.estrutura === 'pods') e.modo = 'multi'; else e.modo = '1v1'; }
    }).then(() => { toast('Alterações salvas'); S.tab = 'info'; render(); window.scrollTo(0, 0); });
  }
  if (f.id === 'fmt-form') {
    const base = S.formatId === 'new' ? S.formatDraft : S.formats[S.formatId];
    const [v, e, d] = readStr('ff-pts').split(/[\/,;\s]+/).filter(Boolean).map(Number);
    const x = Object.assign(clone(base), { nome: readStr('ff-nome'), modo: readStr('ff-modo'), estrutura: readStr('ff-estrutura'), bestOf: readNum('ff-bo', 3), podSize: readNum('ff-pod', 4),
      minutos: readNum('ff-min', 50), limiteValor: readNum('ff-limite', 0), pontos: { v: isNaN(v) ? 3 : v, e: isNaN(e) ? 1 : e, d: isNaN(d) ? 0 : d }, regras: $('#ff-regras').value, banlist: $('#ff-banlist').value });
    document.activeElement && document.activeElement.blur();
    S.formats[x.id] = x; S.formatId = null; render();
    try { await store.save('formats', x.id, x); toast('Formato salvo'); } catch (err) {}
  }
});

document.addEventListener('keydown', k => {
  if (k.key === 'Escape' && S.menuOpen) { S.menuOpen = false; renderNav(); $('#fab').focus(); return; }
  if (k.key === 'Escape' && S.lightbox) { S.lightbox = null; render(); }
});

// relógio da rodada: só atualiza o texto
function tickClock() {
  document.querySelectorAll('[data-clock]').forEach(el => {
    const left = +el.dataset.clock - Date.now();
    const s = Math.abs(Math.round(left / 1000));
    el.textContent = (left < 0 ? '+' : '') + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    el.classList.toggle('over', left < 0);
  });
}
setInterval(tickClock, 1000);

// ---------- inicialização ----------
function startWatching() {
  store.watch('events', d => { S.events = d; render(); });
  store.watch('formats', d => { S.formats = d; render(); });
  if (S.admin) store.watch('regs', d => { S.regs = d; S.myReg = S.uid ? d[S.uid] || null : null; render(); });
  else if (S.mode === 'db' && S.uid) S.db.doc('regs/' + S.uid).onSnapshot(s => { S.myReg = s.exists ? clone(s.data()) : null; render(); }, () => {});
}
// links diretos: #evento/<id> e #checkin/<id>
function routeFromHash() {
  const m = location.hash.match(/^#(evento|checkin|telao)\/([\w-]+)/);
  if (!m) return;
  S.view = m[1] === 'telao' ? 'telao' : 'event'; S.eventId = m[2]; S.tab = 'info'; watchMedia(S.eventId);
}
window.addEventListener('hashchange', () => { routeFromHash(); render(); window.scrollTo(0, 0); });
async function boot() {
  render();
  let db = null, user = null;
  try { if (window.claude && window.claude.use) [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) {}
  if (db) {
    S.mode = 'db'; S.db = db; S.user = user;
    claude.use('assets').then(a => { S.assets = a; render(); }).catch(() => {});
    claude.use('downloads').then(d => { S.downloads = d; }).catch(() => {});
    if (user) {
      try { S.admin = await user.canEdit(); } catch (e) {}
      try { S.uid = await user.id(); } catch (e) {}
      try { const c = await user.can('data.write'); S.canWrite = c !== false; } catch (e) { S.canWrite = true; }
    }
  } else { S.mode = 'local'; S.admin = true; S.canWrite = true; S.uid = 'local'; }
  routeFromHash();
  startWatching();
  render();
}
boot();
</script>
